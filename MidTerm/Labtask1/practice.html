<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Course Registration</title>
</head>
<body>

    <h1>Student Course Registration Form</h1>

    <form>

        <fieldset>
            <legend>Student Information</legend>

            <table>
                <tr>
                    <td><label for="studentID">Student ID:</label></td>
                    <td><input type="text" id="studentID" name="studentID" required></td>
                </tr>

                <tr>
                    <td><label for="studentName">Full Name:</label></td>
                    <td><input type="text" id="studentName" name="studentName" required></td>
                </tr>

                <tr>
                    <td><label for="department">Department:</label></td>
                    <td>
                        <select id="department" name="department">
                            <option value="">-- Select Department --</option>
                            <option value="CSE">CSE</option>
                            <option value="EEE">EEE</option>
                            <option value="BBA">BBA</option>
                            <option value="English">English</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td><label for="semester">Semester:</label></td>
                    <td>
                        <select id="semester" name="semester">
                            <option value="">-- Select Semester --</option>
                            <option>Spring</option>
                            <option>Summer</option>
                            <option>Fall</option>
                        </select>
                    </td>
                </tr>
            </table>
        </fieldset>

        <br>

        <fieldset>
            <legend>Course Selection</legend>

            <input type="checkbox" id="webtech" name="course">
            <label for="webtech">Web Technologies</label><br>

            <input type="checkbox" id="ai" name="course">
            <label for="ai">Artificial Intelligence</label><br>

            <input type="checkbox" id="dbms" name="course">
            <label for="dbms">Database Management System</label><br>

            <input type="checkbox" id="network" name="course">
            <label for="network">Computer Networks</label><br>
        </fieldset>

        <br>

        <fieldset>
            <legend>Class Preference</legend>

            <input type="radio" id="morning" name="shift">
            <label for="morning">Morning</label>

            <input type="radio" id="evening" name="shift">
            <label for="evening">Evening</label>
        </fieldset>

        <br>

        <fieldset>
            <legend>Additional Information</legend>

            <label for="comments">Comments:</label><br>
            <textarea id="comments" name="comments" rows="4" cols="40"></textarea>
        </fieldset>

        <br>

        <input type="submit" value="Register Courses">
        <input type="reset" value="Clear Form">

    </form>

</body>
</html>
